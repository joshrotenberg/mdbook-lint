[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Allow builds on PRs to verify configuration works
pr-run-mode = "plan"
# release.yml is hand-edited: the host job creates the GitHub release with
# RELEASE_TOKEN rather than GITHUB_TOKEN. Without this, dist rejects the
# workflow as out of date, and dist generate would revert the edit. Reapply
# the edit by hand after upgrading cargo-dist.
allow-dirty = ["ci"]
